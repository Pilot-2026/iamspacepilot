# Netlify builds the game from this repository on every push.
# Pull requests get their own preview address automatically.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Online leaderboard: /api/score and /api/leaderboard (see server/).
# They need FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL and FIREBASE_PRIVATE_KEY.
# Online games and voice radio: /api/games and /api/game.
# They need LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
